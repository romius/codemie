# Production managed MCP catalog.
# Copy this content into the `managed-mcp-servers.yaml` key of the
# `codemie-customer-config` ConfigMap. Schema: see managed-mcp-servers.example.yaml.
#
# `url` points at the CodeMie MCP proxy, not at the upstream MCP server: the
# proxy owns the per-server token exchange, so clients only ever hold a
# CodeMie-realm token. The upstream `https://mcp.epam.com/mcp/<key>` endpoints
# and their audiences are proxy-side configuration and are deliberately absent
# from this client-facing catalog.
#
# Every server carries its own full `oauth` block. The values are identical
# today because all servers share one public OAuth client, but each entry is
# independent: change one server's OAuth parameters without touching the rest.
servers:
  - name: expertise_search
    transport: http
    url: https://codemie.lab.epam.com/mcp/mcp-proxy/expertise_search
    auth: oauth
    description: >-
      Provides access to integrated organizational knowledge by connecting employee expertise,
      project data, and case studies. This empowers clients to quickly find relevant information
      for resource management, project insights and decision support within an EPAM company.
    oauth:
      clientId: codemie-mcp-proxy
      scope: openid profile email
      callbackHost: localhost
      callbackPort: 3118
      authorizationServer: ["https://auth.codemie.lab.epam.com/realms/codemie-prod"]
      authorizationUrl: https://auth.codemie.lab.epam.com/realms/codemie-prod/protocol/openid-connect/auth?kc_idp_hint=epam-oidc&prompt=login
      tokenUrl: https://auth.codemie.lab.epam.com/realms/codemie-prod/protocol/openid-connect/token

  - name: data_catalog
